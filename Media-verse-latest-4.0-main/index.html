
<!DOCTYPE html>
<html lang="en">
<head>

  <title>MediaVerse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Base Fonts */
    :root {
      --font-sans: 'Inter', sans-serif;
      --font-display: 'Space+Grotesk', sans-serif;
      --font-mono: 'Roboto Mono', monospace;
    }

    /* --- APPLICATION THEMES --- */

      --color-sidebar-bg: 25 25 33;
      --color-card-bg: 36 36 49;
      --color-input-bg: 30 30 42;
      --color-border-color: 55 55 71;
      --color-text-primary: 239 241 245;
      --color-text-secondary: 148 153 179;
      --border-radius-card: 0.5rem; /* lg */
      --border-radius-input: 0.5rem; /* lg */
    }

    /* THEME: Classic */
    html[data-theme='classic'] {
      --font-sans: 'Inter', sans-serif;
      --font-display: 'Space Grotesk', sans-serif;

    /* THEME: Light */

    /* THEME: Nordic */

    /* THEME: Solarized */
    html[data-theme='solarized'] {

    /* THEME: Crimson Noir */
    html[data-theme='crimson-noir'] {
      --font-sans: 'Inter', sans-serif;
      --font-display: 'Space Grotesk', sans-serif;
      --color-primary: 220 38 38; /* Red-600 */

      --color-border-color: 45 45 45;

    }

    /* THEME: Evergreen */
    html[data-theme='evergreen'] {
      --font-sans: 'Inter', sans-serif;
      --font-display: 'Space Grotesk', sans-serif;
      --color-primary: 22 163 74; /* Green-600 */
      --color-app-bg: 20 26 20;

    /* THEME: Cyberpunk */
    html[data-theme='cyberpunk'] {
      --font-sans: 'Roboto Mono', monospace;
      --font-display: 'Roboto Mono', monospace;
      --color-primary: 236 72 153; /* Pink-500 */
      --color-app-bg: 26 11 46;
      --color-sidebar-bg: 40 21 68;
      --color-card-bg: 55 35 88;
      --color-input-bg: 48 28 78;
      --color-border-color: 80 50 120;

      --color-text-secondary: 190 130 210;
      --border-radius-card: 0rem; /* none */
      --border-radius-input: 0rem; /* none */
    }

    /* THEME: Sunset */
    html[data-theme='sunset'] {
      --font-sans: 'Inter', sans-serif;
      --font-display: 'Space Grotesk', sans-serif;
      --color-primary: 249 115 22; /* Orange-500 */
      --color-app-bg: 49 46 129; /* Indigo-900 */
      --color-sidebar-bg: 67 56 202;
      --color-card-bg: 79 70 229;
      --color-input-bg: 72 63 215;
      --color-border-color: 100 90 240;
      --color-text-primary: 253 186 116; /* Orange-300 */
      --color-text-secondary: 254 215 170;
      --border-radius-card: 9999px; /* full */
      --border-radius-input: 9999px; /* full */
    }

    /* THEME: Matrix */
    html[data-theme='matrix'] {
      --font-display: 'Roboto Mono', monospace;
      --font-sans: 'Roboto Mono', monospace;
      --color-primary: 52 211 153; /* Emerald-400 */
      --color-app-bg: 0 0 0;
      --color-sidebar-bg: 5 10 5;
      --color-card-bg: 10 20 10;
      --color-input-bg: 8 15 8;
      --color-border-color: 20 50 20;
      --color-text-primary: 52 211 153;
      --color-text-secondary: 30 150 100;
      --border-radius-card: 0rem; /* none */
      --border-radius-input: 0rem; /* none */
    }
    
    /* --- VIDEO PLAYER SKINS --- */
    .player-container {
        --player-scrubber-thickness: 4px;
        --player-scrubber-radius: 9999px;
        --player-font-main: var(--font-sans);
        --player-font-mono: var(--font-mono);
        --player-control-bg-opacity: 0.4;
    }
    .player-container.scrubber-md { --player-scrubber-thickness: 6px; }
    .player-container.scrubber-lg { --player-scrubber-thickness: 8px; }
    .player-container.scrubber-square { --player-scrubber-radius: 0px; }
    
    .player-skin-default {
      --player-bg: 0 0 0 / var(--player-control-bg-opacity);
      --player-text-primary: 255 255 255;
      --player-text-secondary: 200 200 200;
      --player-accent: var(--player-custom-accent, 139 92 246); /* Vibrant Violet */
      --player-scrubber-bg: 255 255 255 / 0.2;
      --player-radius: 0.5rem;
      --player-text-shadow: none;
    }
    .player-skin-default .player-popover { background-color: rgba(30, 30, 40, 0.9); border: 1px solid rgba(255, 255, 255, 0.1); }
    .player-skin-minimal {
      --player-bg: 0 0 0 / var(--player-control-bg-opacity);
      --player-text-primary: 220 220 220;
      --player-text-secondary: 180 180 180;
      --player-accent: var(--player-custom-accent, 255 255 255);
      --player-scrubber-bg: 255 255 255 / 0.3;
      --player-radius: 0.25rem;
      --player-text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    }
    .player-skin-minimal .player-popover { background-color: rgba(0,0,0,0.7); border: 1px solid rgba(255, 255, 255, 0.1);}
    .player-skin-cinema {
      --player-bg: 0 0 0 / var(--player-control-bg-opacity);
      --player-text-primary: 252 211 77; /* Amber-300 */
      --player-text-secondary: 229 231 235; /* Gray-200 */
      --player-accent: var(--player-custom-accent, 252 211 77);
      --player-scrubber-bg: 255 255 255 / 0.1;
      --player-radius: 0.375rem;
      --player-text-shadow: none;
    }
    .player-skin-cinema .player-popover { background-color: rgba(10, 5, 0, 0.95); border: 1px solid rgba(252, 211, 77, 0.2); }
     .player-skin-retro-tv {
      --player-bg: 120 80 40 / calc(var(--player-control-bg-opacity) + 0.3);
      --player-text-primary: 255 235 205; /* Blanched Almond */
      --player-text-secondary: 210 180 140; /* Tan */
      --player-accent: var(--player-custom-accent, 255 100 0);
      --player-scrubber-bg: 255 255 255 / 0.2;
      --player-radius: 0.25rem;
      --player-text-shadow: none;
    }
    .player-skin-retro-tv .player-popover { background-color: #8B4513; border: 2px solid #654321; }
    .player-skin-neon-glow {
      --player-bg: 26 11 46 / var(--player-control-bg-opacity);
      --player-text-primary: 240 171 252;
      --player-text-secondary: 190 130 210;
      --player-accent: var(--player-custom-accent, 236 72 153);
      --player-scrubber-bg: 255 255 255 / 0.1;
      --player-radius: 0;
      --player-text-shadow: 0 0 5px rgb(var(--player-accent));
    }
    .player-skin-neon-glow .player-popover { background-color: rgba(var(--player-bg), 0.9); border: 1px solid rgb(var(--player-accent)); box-shadow: 0 0 10px rgb(var(--player-accent)); }
    .player-skin-professional {
      --player-bg: 10 10 10 / var(--player-control-bg-opacity);
      --player-text-primary: 245 245 245;
      --player-text-secondary: 180 180 180;
      --player-accent: var(--player-custom-accent, 255 255 255);
      --player-scrubber-bg: 255 255 255 / 0.2;
      --player-radius: 0.25rem;
      --player-text-shadow: none;
    }
    .player-skin-professional .player-popover { background-color: #121212; border: 1px solid #333; }
    .player-skin-vibrant-glass {
      --player-bg: 255 255 255 / calc(var(--player-control-bg-opacity) - 0.3);
      --player-text-primary: 255 255 255;
      --player-text-secondary: 220 220 220;
      --player-accent: var(--player-custom-accent, 139 92 246);
      --player-scrubber-bg: 255 255 255 / 0.3;
      --player-radius: 0.75rem;
      --player-text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    }
    .player-skin-vibrant-glass.glassmorphism-enabled footer, .player-skin-vibrant-glass.glassmorphism-enabled header, .player-skin-vibrant-glass.glassmorphism-enabled .player-popover { backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
    .player-skin-classic-player {
      --player-bg: 200 200 210 / calc(var(--player-control-bg-opacity) + 0.5);
      --player-text-primary: 10 10 10;
      --player-text-secondary: 50 50 50;
      --player-accent: var(--player-custom-accent, 59 130 246);
      --player-scrubber-bg: 0 0 0 / 0.2;
      --player-radius: 0.375rem;
      --player-text-shadow: none;
    }
    .player-skin-classic-player .player-popover { background-color: #E5E7EB; border: 1px solid #D1D5DB; }
    .player-skin-artistic {
      --player-bg: 250 245 240 / calc(var(--player-control-bg-opacity) + 0.4);
      --player-text-primary: 50 40 30;
      --player-text-secondary: 100 90 80;
      --player-accent: var(--player-custom-accent, 220 38 38);
      --player-scrubber-bg: 50 40 30 / 0.2;
      --player-radius: 0.3rem 1rem;
      --player-text-shadow: none;
    }
    .player-skin-artistic .player-popover { background-color: rgba(250, 245, 240, 0.95); border: 1px solid #D2B48C; }
    .player-skin-mobile {
      --player-bg: 0 0 0 / var(--player-control-bg-opacity);
      --player-text-primary: 255 255 255;
      --player-text-secondary: 200 200 200;
      --player-accent: var(--player-custom-accent, 34 211 238);
      --player-scrubber-bg: 255 255 255 / 0.2;
      --player-radius: 9999px;
      --player-text-shadow: none;
    }
    .player-skin-mobile.glassmorphism-enabled .player-popover { background-color: rgba(var(--player-bg), 0.9); backdrop-filter: blur(16px); }
    .player-skin-arctic-glass {
      --player-bg: 255 255 255 / calc(var(--player-control-bg-opacity) - 0.25);
      --player-text-primary: 255 255 255;
      --player-text-secondary: 220 220 220;
      --player-accent: var(--player-custom-accent, 34 211 238);
      --player-scrubber-bg: 255 255 255 / 0.3;
      --player-radius: 0.75rem;
      --player-text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    }
    .player-skin-arctic-glass.glassmorphism-enabled footer, .player-skin-arctic-glass.glassmorphism-enabled header, .player-skin-arctic-glass.glassmorphism-enabled .player-popover { backdrop-filter: blur(16px) saturate(1.5); -webkit-backdrop-filter: blur(16px) saturate(1.5); }
    .player-skin-midnight-minimal {
      --player-bg: 0 0 0 / calc(var(--player-control-bg-opacity) - 0.4);
      --player-text-primary: 255 255 255;
      --player-text-secondary: 200 200 200;
      --player-accent: var(--player-custom-accent, 255 255 255);
      --player-scrubber-bg: 255 255 255 / 0.25;
      --player-radius: 0.5rem;
      --player-text-shadow: 0 1px 3px rgba(0,0,0,0.5);
    }
    .player-skin-midnight-minimal.show-gradient footer { background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0) 100%); }
    .player-skin-midnight-minimal.show-gradient header { background: linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0) 100%); }
    .player-skin-midnight-minimal.glassmorphism-enabled .player-popover { background-color: rgba(20, 20, 20, 0.8); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
    .player-skin-aqua-marine {
      --player-bg: 32 128 128 / calc(var(--player-control-bg-opacity) - 0.3);
      --player-text-primary: 230 255 250;
      --player-text-secondary: 180 220 210;
      --player-accent: var(--player-custom-accent, 64 224 208);
      --player-scrubber-bg: 255 255 255 / 0.2;
      --player-radius: 0.5rem;
      --player-text-shadow: none;
    }
    .player-skin-aqua-marine.glassmorphism-enabled footer, .player-skin-aqua-marine.glassmorphism-enabled header, .player-skin-aqua-marine.glassmorphism-enabled .player-popover { backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-top: 1px solid rgba(var(--player-accent), 0.2); border-bottom: 1px solid rgba(var(--player-accent), 0.2); }
    .player-skin-ruby-red {
      --player-bg: 159 18 57 / calc(var(--player-control-bg-opacity) - 0.3);
      --player-text-primary: 255 240 245;
      --player-text-secondary: 255 220 230;
      --player-accent: var(--player-custom-accent, 244 63 94);
      --player-scrubber-bg: 255 255 255 / 0.25;
      --player-radius: 1rem;
      --player-text-shadow: none;
    }
    .player-skin-ruby-red.glassmorphism-enabled footer, .player-skin-ruby-red.glassmorphism-enabled header, .player-skin-ruby-red.glassmorphism-enabled .player-popover { backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
    .player-skin-zen-garden {
      --player-bg: 40 50 40 / var(--player-control-bg-opacity);
      --player-text-primary: 230 240 230;
      --player-text-secondary: 180 195 180;
      --player-accent: var(--player-custom-accent, 134 239 172);
      --player-scrubber-bg: 255 255 255 / 0.15;
      --player-radius: 0.375rem;
      --player-text-shadow: none;
    }
    .player-skin-zen-garden .player-popover { background-color: rgba(40, 50, 40, 0.95); border: 1px solid rgba(134, 239, 172, 0.2); }

    /* --- NEW ANIMATIONS & STYLES --- */

    @keyframes dialogScaleIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    .animate-dialog-scale-in {
      animation: dialogScaleIn 0.2s ease-out forwards;
    }
    
    @keyframes feedbackPop {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(var(--color-primary), 0); }
      30% { transform: scale(1.05); box-shadow: 0 0 20px rgba(var(--color-primary), 0.5); border-color: rgb(var(--color-primary)); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(var(--color-primary), 0); border-color: transparent; }
    }
    .animate-feedback-pop {
      animation: feedbackPop 1.5s ease-out forwards;
    }
    
    .marquee-selection-box {
        position: absolute;
        border: 1px solid rgb(var(--color-primary));
        background-color: rgb(var(--color-primary) / 0.2);
        z-index: 10;
        pointer-events: none;
    }

    .media-card {
      transition: transform 0.2s ease, box-shadow 0.2s ease, outline-color 0.2s ease;
    }
    .media-card .quick-actions {
        opacity: 0;
        transition: opacity 0.2s ease-in-out;
    }
    .media-card:hover .quick-actions, .media-card[data-is-selected='true'] .quick-actions {
        opacity: 1;
    }
    .media-card[data-hover-effect="glow"]:hover {
      box-shadow: 0 0 15px rgb(var(--color-primary) / 0.6);
      transform: scale(1.03);
    }
     .media-card[data-hover-effect="scale"]:hover {
      transform: scale(1.05);
    }


    .clip-range-scrubber .handle {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        width: 16px;
        height: 16px;
        background-color: white;
        border: 2px solid rgb(var(--player-accent));
        border-radius: 50%;
        cursor: ew-resize;
        z-index: 10;
        transition: transform 0.1s ease;
    }
    .clip-range-scrubber .handle:hover {
        transform: translateY(-50%) scale(1.2);
    }
    .clip-range-scrubber .handle.start {
        left: 0;
        transform: translate(-50%, -50%);
    }
     .clip-range-scrubber .handle.end {
        right: 0;
        transform: translate(50%, -50%);
    }

    /* HIDE CURSOR for player */
    .player-container.hide-cursor {
      cursor: none;
    }

    @keyframes scalePop {
      0% { opacity: 0; transform: scale(0.5); }
      50% { opacity: 1; transform: scale(1.1); }
      100% { opacity: 0; transform: scale(1); }
    }
    .animate-scalePop { 
        animation: scalePop 0.7s ease-out forwards; 
    }

    .slider-vertical {
        -webkit-appearance: none;
        appearance: none;
        width: 120px;
        height: 6px;
        background: transparent;
        cursor: pointer;
        transform: rotate(-90deg);
    }
    .slider-vertical::-webkit-slider-runnable-track {
        width: 100%;
        height: 4px;
        background: rgb(var(--player-scrubber-bg));
        border-radius: 2px;
    }
    .slider-vertical::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        margin-top: -6px;
        width: 16px;
        height: 16px;
        background: white;
        border-radius: 50%;
        box-shadow: 0 0 4px rgb(var(--player-accent));
        transition: transform 0.2s ease;
    }
    .slider-vertical:hover::-webkit-slider-thumb {
        transform: scale(1.1);
    }
    .slider-vertical::-moz-range-track {
        width: 100%;
        height: 4px;
        background: rgb(var(--player-scrubber-bg));
        border-radius: 2px;
    }
    .slider-vertical::-moz-range-thumb {
        width: 16px;
        height: 16px;
        background: white;
        border-radius: 50%;
        border: none;
        box-shadow: 0 0 4px rgb(var(--player-accent));
        transition: transform 0.2s ease;
    }
    .slider-vertical:hover::-moz-range-thumb {
        transform: scale(1.1);
    }
    
    /* --- BASE STYLES --- */
    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font-sans);
      background-color: rgb(var(--color-app-bg));
      background-image: radial-gradient(circle at 1px 1px, rgb(var(--color-border-color) / 0.5) 1px, transparent 0);
      background-size: 2rem 2rem;
      color: rgb(var(--color-text-primary));
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: rgb(var(--color-sidebar-bg)); }
    ::-webkit-scrollbar-thumb { background: rgb(var(--color-primary) / 0.5); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgb(var(--color-primary) / 0.8); }

    h1, h2, h3, h4, h5, h6 { font-family: var(--font-display); }

    .dragging { opacity: 0.5; background: rgb(var(--color-primary) / 0.1); }
    .drop-indicator { border-top: 2px solid rgb(var(--color-primary)); margin-top: -2px; }

    /* New Grid Interaction Styles */
    .media-card[data-is-focused='true'] .card-focus-ring {
      outline: 2px solid rgb(var(--color-primary));
      outline-offset: 2px;
    }
    .media-card[data-is-selected='true'] .card-selection-overlay {
      background-color: rgb(var(--color-primary) / 0.3);
      border-color: rgb(var(--color-primary));
    }
    .media-card .hover-select-checkbox {
      opacity: 0;
    }
    .media-card:hover .hover-select-checkbox, .media-card[data-is-selected='true'] .hover-select-checkbox {
      opacity: 1;
    }
  </style>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          borderRadius: {
            card: 'var(--border-radius-card)',
            input: 'var(--border-radius-input)',
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Space Grotesk', 'sans-serif'],
          },
          colors: {
            primary: 'rgb(var(--color-primary) / <alpha-value>)',
            'app-bg': 'rgb(var(--color-app-bg) / <alpha-value>)',
            'sidebar-bg': 'rgb(var(--color-sidebar-bg) / <alpha-value>)',
            'card-bg': 'rgb(var(--color-card-bg) / <alpha-value>)',
